; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = ui_n16r8

[env:freenove_esp32_s3_wroom]
platform = espressif32 @ 7.0.0
board = freenove_esp32_s3_wroom
framework = arduino
build_flags =
    -Iinclude
build_src_filter =
    +<*>
    -<bringup/>
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.14.1

; Bring-up firmware: MCU + OLED + encoder + buttons + UI only. Upload with `pio run -e bringup -t upload`.
[env:bringup]
platform = espressif32 @ 7.0.0
board = freenove_esp32_s3_wroom
framework = arduino
build_flags =
    -Iinclude
build_src_filter =
    -<*>
    +<bringup/>
    -<bringup/ui_only_devices.cpp>
upload_speed = 115200
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.14.1

; Host-side unit tests: `pio test -e native` (needs a host gcc/g++, e.g. MinGW-w64 on Windows)
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -Iinclude
    -Itest/support
lib_ignore =
    ADS1015
    ADS7128
    DAC
    Display
    INA
    SdLog

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter =
    +<*>
    -<bringup/>

; Custom PCB, ESP32-S3-WROOM N16R8. UART serial through USB-to-UART bridge.
[env:ui_n16r8]
extends = env:bringup
platform = espressif32 @ 7.0.0
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags =
    -Iinclude
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DUI_ONLY_BRINGUP
build_src_filter =
    -<*>
    +<bringup/main.cpp>
    +<bringup/ui_only_devices.cpp>
monitor_filters = send_on_enter
monitor_echo = yes

; Use this instead when connected directly to the ESP32-S3 native USB port.
[env:ui_n16r8_usb]
extends = env:ui_n16r8
build_flags =
    -Iinclude
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUI_ONLY_BRINGUP



; Full application: real load control and asynchronous microSD logging.
; Explicit selection only; the working UI default is retained.
[env:load_n16r8]
extends = env:ui_n16r8
build_flags =
    -Iinclude
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
build_src_filter =
    +<*>
    -<bringup/>

[env:load_n16r8_usb]
extends = env:load_n16r8
build_flags =
    -Iinclude
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
