; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = freenove_esp32_s3_wroom

[env:freenove_esp32_s3_wroom]
platform = espressif32 @ 7.0.0
board = freenove_esp32_s3_wroom
framework = arduino
build_flags =
    -Iinclude
build_src_filter =
    +<*>
    -<bringup/>
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.14.1

; Bring-up firmware: MCU + OLED + encoder + buttons + UI only. Upload with `pio run -e bringup -t upload`.
[env:bringup]
platform = espressif32 @ 7.0.0
board = freenove_esp32_s3_wroom
framework = arduino
build_flags =
    -Iinclude
build_src_filter =
    -<*>
    +<bringup/>
upload_speed = 115200
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.14.1

; Host-side unit tests: `pio test -e native` (needs a host gcc/g++, e.g. MinGW-w64 on Windows)
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -Iinclude
    -Itest/support
lib_ignore =
    ADS1015
    ADS7128
    DAC
    Display
    INA
    SdLog

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter =
    +<*>
    -<bringup/>